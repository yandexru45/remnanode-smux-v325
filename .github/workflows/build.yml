name: build-image

on:
  workflow_dispatch:
    inputs:
      node_tag:
        description: "Upstream remnanode-smux tag"
        required: false
        default: "v3.2.5"
      xray_core_version:
        description: "Xray core version"
        required: false
        default: "v26.8.24"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_TAG: ${{ github.event.inputs.node_tag || 'v3.2.5' }}
  XRAY_CORE_VERSION: ${{ github.event.inputs.xray_core_version || 'v26.8.24' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream node sources
        uses: actions/checkout@v4
        with:
          repository: legiz-ru/remnanode-smux
          ref: ${{ github.event.inputs.node_tag || 'v3.2.5' }}
          path: upstream

      - name: Prepare image metadata
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          CORE_NO_V="${XRAY_CORE_VERSION#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LC}/remnanode-smux:${NODE_TAG}-panel281"
            echo "ghcr.io/${OWNER_LC}/remnanode-smux:${NODE_TAG}-xray${CORE_NO_V}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XRAY_CORE_VERSION=${{ env.XRAY_CORE_VERSION }}
            UPSTREAM_REPO=Jolymmiles
          tags: ${{ steps.meta.outputs.tags }}
